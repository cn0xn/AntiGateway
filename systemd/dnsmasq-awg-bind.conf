# Drop-in: привязка dnsmasq к awg-quick@awg0.
#
# Проблема: dnsmasq.conf содержит `server=1.1.1.1@awg0` (upstream через
# туннель, SO_BINDTODEVICE). Когда awg0 пересоздаётся (watchdog рестартит
# AWG при stale handshake / blackhole, или конфиг меняют через Web UI),
# dnsmasq остаётся со сломанной привязкой к старому ifindex и фейлит ВСЕ
# upstream-запросы: "failed to bind server socket to awg0: Cannot assign
# requested address" → REFUSED → клиенты без DNS. SIGHUP (reload) это НЕ
# лечит — сокеты не пересоздаются, нужен полный restart.
#
# PartOf: systemd автоматически рестартит dnsmasq каждый раз когда
# awg-quick@awg0 рестартится/останавливается. After: правильный порядок
# при загрузке (awg0 существует к моменту бинда upstream).
#
# Отдельный файл (не трогаем основной override.conf с ExecStart-фиксом).

[Unit]
After=awg-quick@awg0.service
PartOf=awg-quick@awg0.service
